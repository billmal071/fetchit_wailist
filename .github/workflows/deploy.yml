name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Surface lint output without blocking the pipeline on pre-existing issues.
      - name: Run linter
        continue-on-error: true
        run: pnpm lint

  # ─── Test ──────────────────────────────────────────────────────────────────
  # Runs the Jest suite (jsdom + testing-library). Passes when there are no
  # tests yet so the gate is in place and starts enforcing as tests land.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test:ci

  # ─── Security Audit ────────────────────────────────────────────────────────
  # Reports known dependency vulnerabilities (pnpm audit). Non-blocking for
  # now — there is a backlog of pre-existing transitive advisories; this keeps
  # them visible on every run. Tighten to a hard gate (drop continue-on-error,
  # lower --audit-level) once the backlog is triaged.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=high

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    # Bound to the GitHub Environment so it can read env-scoped NEXT_PUBLIC_*
    # vars, which bake into the client bundle at build time.
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: pnpm build

      # Next's standalone trace copies pnpm's .pnpm virtual store but omits the
      # top-level node_modules/<pkg> entries for some transitive runtime deps
      # (e.g. styled-jsx), so `node server.js` crashes with MODULE_NOT_FOUND.
      # Recreate every top-level package from the store so the bundle is
      # self-contained.
      - name: Materialize pnpm transitive deps into standalone bundle
        run: |
          NM=.next/standalone/node_modules
          if [ -d "$NM/.pnpm" ]; then
            count=0
            while IFS= read -r pkgdir; do
              base=$(basename "$pkgdir"); parent=$(basename "$(dirname "$pkgdir")")
              if [ "$parent" = "node_modules" ]; then dest="$NM/$base"; else dest="$NM/$parent/$base"; fi
              if [ -d "$dest" ] && [ -e "$dest/package.json" ]; then continue; fi
              rm -rf "$dest"; mkdir -p "$(dirname "$dest")"
              cp -rL "$pkgdir" "$dest" 2>/dev/null && count=$((count+1)) || true
            done < <(find "$NM/.pnpm" -mindepth 3 -maxdepth 3 -path '*/node_modules/*' -not -name '.*' -prune)
            echo "materialized $count top-level packages"
            test -e "$NM/styled-jsx/package.json" || { echo "styled-jsx still missing"; exit 1; }
          fi

      - name: Assemble deploy bundle
        run: |
          mkdir -p deploy/.next
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          cp ecosystem.config.js deploy/

      - name: Upload deploy bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          retention-days: 1
          include-hidden-files: true
          path: deploy/

  # ─── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'push'
    environment: development
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: ./deploy

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Ensure APP_PATH and logs dir exist on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$APP_PATH/logs'"

      - name: Rsync bundle to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          rsync -avz --delete \
            --exclude='logs' \
            -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            ./deploy/ \
            "$SERVER_USER@$SERVER_HOST:$APP_PATH/"

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_PATH
          script: |
            source ~/.nvm/nvm.sh
            export DEPLOY_ENV=development
            cd "$APP_PATH"
            npx pm2 save --force || true
            npx pm2 reload ecosystem.config.js --env development \
              || npx pm2 start ecosystem.config.js --env development
            npx pm2 save
            echo "Deployed waitlist (development)."
        env:
          APP_PATH: ${{ secrets.APP_PATH }}

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_PORT
          script: |
            echo "Waiting for application to become ready..."
            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 5 \
                "http://localhost:${APP_PORT:-3100}/" || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed."
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed after 2 minutes."
            exit 1
        env:
          APP_PORT: ${{ secrets.APP_PORT }}

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            source ~/.nvm/nvm.sh
            echo "Rolling back to previous PM2 snapshot..."
            npx pm2 resurrect || true

      - name: Cleanup sensitive files
        if: always()
        run: rm -f ~/.ssh/deploy_key
